name: CI健康診断

# mainブランチにコミットするたび、またはPull Request作成時に自動実行される。
# コードやデータに問題があれば、GitHub上にすぐ赤い✕マークで表示される。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 手動実行もできるようにしておく

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 健康診断を実行
        run: python scripts/ci_checks.py
